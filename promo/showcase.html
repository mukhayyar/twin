<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1600px; background: transparent; font-family: -apple-system, system-ui, sans-serif; }
  .row { display: flex; align-items: center; justify-content: center; gap: 28px; padding: 40px 30px 30px; }
  figure { text-align: center; }
  img { width: 230px; height: 230px; display: block; }
  figcaption { font: 600 22px/1.2 -apple-system, system-ui; color: #8E8AA3; margin-top: 6px; }
  .arrow { font: 300 64px -apple-system; color: #8E8AA3; margin: 0 6px 34px; }
</style></head><body>
<div class="row">
  <figure><img src="media/discord.png"><figcaption>Discord</figcaption></figure>
  <div class="arrow">→</div>
  <figure><img src="media/discord-work.png"><figcaption>Discord-Work</figcaption></figure>
  <figure><img src="media/discord-personal.png"><figcaption>Discord-Personal</figcaption></figure>
  <figure><img src="media/discord-hobby.png"><figcaption>Discord-Hobby</figcaption></figure>
  <figure><img src="media/google-chrome-school.png"><figcaption>Google Chrome-School</figcaption></figure>
</div>
</body></html>
