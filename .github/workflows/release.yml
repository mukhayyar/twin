name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build the CLI
        run: VERSION="$GITHUB_REF_NAME" scripts/build-cli.sh
      - name: Build the app
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh
      - name: Checksums
        working-directory: dist
        run: shasum -a 256 *.tar.gz *.zip | tee checksums.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{{VERSION}}/${GITHUB_REF_NAME#v}/g" .github/release-notes.md > dist/notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --title "Twin $GITHUB_REF_NAME" --notes-file dist/notes.md --verify-tag
