name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # AppImages need a Linux host (macOS runners have no Docker); the release job
  # picks them up before computing checksums.
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the AppImages
        run: VERSION="$GITHUB_REF_NAME" scripts/build-appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: appimages
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    needs: appimage
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build the CLI
        run: VERSION="$GITHUB_REF_NAME" scripts/build-cli.sh
      - name: Build the app
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh
      - name: Build the disk image
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-dmg.sh
      - uses: actions/download-artifact@v8
        with:
          name: appimages
          path: dist
      - name: Checksums
        working-directory: dist
        run: shasum -a 256 -- *.dmg *.zip *.tar.gz *.AppImage *.exe | tee checksums.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{{VERSION}}/${GITHUB_REF_NAME#v}/g" .github/release-notes.md > dist/notes.md
          gh release create "$GITHUB_REF_NAME" \
            dist/*.dmg dist/*.zip dist/*.tar.gz dist/*.AppImage dist/*.exe dist/checksums.txt \
            --title "Twin $GITHUB_REF_NAME" --notes-file dist/notes.md --verify-tag
